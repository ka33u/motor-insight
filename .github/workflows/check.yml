name: Check MotorInsight
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/repository_check.py
      - run: python scripts/export_bi_design.py
      - run: python scripts/validate_bi_design.py --current-only
      - run: python manage.py check
      - run: python manage.py test --noinput --verbosity 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_workbench.mjs
      - run: node tests/check_joint_compare.mjs
      - run: node tests/check_baseline_trial.mjs
      - run: node tests/check_order_baseline.mjs
      - run: node tests/check_schedule_reading.mjs
      - run: node tests/check_joint_candidates.mjs
      - run: node tests/check_joint_blockers.mjs
      - run: node tests/check_joint_material.mjs
      - run: node tests/check_batch_material.mjs
      - run: node tests/check_joint_occupancy.mjs
      - run: node tests/check_trial_favorites.mjs
      - run: node tests/check_joint_setup.mjs
      - run: node tests/check_material_returns.mjs
      - run: node tests/check_return_stock.mjs
      - run: node tests/check_wip_readiness.mjs
