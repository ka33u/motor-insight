name: Check MotorInsight
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/repository_check.py
      - run: python manage.py check
      - run: python manage.py test --noinput --verbosity 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_workbench.mjs
      - run: node tests/check_joint_compare.mjs
